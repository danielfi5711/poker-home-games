name: Keep Render app warm

# Render's free web-service tier spins the app down after ~15 minutes of no
# HTTP traffic, causing a slow (30-50s) cold start on the next real request.
# Pinging the health endpoint every 10 minutes keeps it warm 24/7, for free
# (this repo is public, so Actions minutes are unlimited/free regardless of
# how often this runs).
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 30 https://poker-home-games.onrender.com/healthz
